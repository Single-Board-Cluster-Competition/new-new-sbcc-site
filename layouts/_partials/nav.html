{{- $event := partialCached "event.html" . "event" -}}
<nav id="top-nav" class="card">
    <a class="brand" href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>
        <img src="{{ "assets/favicon.png" | relURL }}" alt="" data-optional>
        <span>SBCC {{ $event.year }}</span>
    </a>
    {{- range site.Menus.main }}
    <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{- end }}
    {{- with $event.event.register_url }}
    <a class="btn register" href="{{ . }}" target="_blank" rel="noopener">Register ↗</a>
    {{- end }}
</nav>
