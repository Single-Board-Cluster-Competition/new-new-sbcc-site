{{- $event := partialCached "event.html" . "event" -}}
<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "en" }}">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Title }} {{ $event.year }}{{ end }}">
        <link rel="icon" type="image/png" href="{{ "assets/favicon.png" | relURL }}">
        <link rel="apple-touch-icon" href="{{ "assets/apple-touch-icon.png" | relURL }}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ "css/style.css" | relURL }}?v={{ readFile "static/css/style.css" | sha256 }}">
        <script src="{{ "js/site.js" | relURL }}" defer></script>
        <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · SBCC {{ $event.year }}{{ end }}</title>
    </head>
    <body>
        {{ partial "nav.html" . }}
        <main{{ with .Params.main_class }} class="{{ . }}"{{ end }}>
            {{- block "main" . }}{{ end }}
        </main>
        {{ partial "footer.html" . }}
    </body>
</html>
