# Each entry becomes a dropdown under "Frequently Asked Questions".
# `answer` is Markdown. Placeholders filled from event.yaml:
#   {year} {dates} {location} {signup_deadline} {proposal_deadline}
#   {power_limit} {price_limit} {team_size}
- question: When and where is it?
  answer: "{dates} ({location})."

- question: What is the price limit for the hardware?
  answer: "{price_limit}"

- question: What is the power limit for the cluster?
  answer: "{power_limit}"

- question: When is the deadline for sign up?
  answer: >-
    The application deadline is {signup_deadline}.
    Your real deadline is getting hardware, and setting it up in time.
    After sign up you need to submit a proposal for the hardware you're going to use by {proposal_deadline}.

- question: How many students can be in a team? Do all members need to be undergraduates and/or from the same university?
  answer: >-
    Each team should have {team_size}.
    Teams are welcome to have students from different universities.
    We ask that all students officially competing are undergraduates unless you are unable to meet the minimum number of team members
    (in this case, please reach out to the organizers prior to submitting the team application).

- question: Does the SBCC Committee purchase or provide hardware for the participating teams?
  answer: >-
    No, each team is expected to provide their own hardware.
    The goal of the price limit is to encourage more hardware diversity.
